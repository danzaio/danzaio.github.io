<style>
:root{
  --hdr:54px; --tab:62px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --bg:#f1e6cf; --paper:#fbf6ea; --paper2:#f3e9d4; --ink:#2a2018; --muted:#6f604f; --line:#dbc9a4;
  --gold:#94700f; --gold2:#c99a2e; --crimson:#8f1d1d; --ok:#2f6b3a; --blue:#1f6fd1;
  --sea:#a9c2c5; --sea2:#97b1b5; --land:#eadcb9; --land2:#d8c597; --old:#c97a53; --old2:#a65a39;
  --wall:#f6efdc; --walls:#6a4e31; --road:#fbf5e6; --label:#3b2d20; --sealabel:#4f6e73;
  --c-cidade:#8f1d1d; --c-muralhas:#94700f; --c-arredores:#2c5f6e; --c-excursao:#5b3f7a;
  --shadow:0 8px 28px rgba(45,28,10,.20);
}
:root.dark{
  --bg:#101215; --paper:#1a1d22; --paper2:#23272e; --ink:#efe6d2; --muted:#a79e8e; --line:#323840;
  --gold:#d8b04a; --gold2:#ecc65c; --crimson:#d9554a; --ok:#63b673; --blue:#5aa2ff;
  --sea:#0e2330; --sea2:#123344; --land:#2a2924; --land2:#3a382f; --old:#7a3b27; --old2:#5c2b1b;
  --wall:#d9ccab; --walls:#cbbd9c; --road:#4a463d; --label:#eadfc7; --sealabel:#6e97a3;
  --c-cidade:#d9554a; --c-muralhas:#d8b04a; --c-arredores:#4fa3b8; --c-excursao:#a98bd6;
  --shadow:0 8px 28px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
a{color:var(--gold)}
.serif{font-family:Cinzel,"Times New Roman",serif}
h1,h2,h3{font-family:Cinzel,"Times New Roman",serif;margin:0;letter-spacing:.02em}
/* header */
.top{position:fixed;top:0;left:0;right:0;height:calc(var(--hdr) + var(--sat));padding:var(--sat) 12px 0;display:flex;align-items:center;gap:10px;background:var(--paper);border-bottom:2px solid var(--gold2);z-index:30}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand svg{flex:none}
@media (max-width:359px){.brand>svg{display:none}.top{gap:6px}}

.brand b{display:block;font-family:Cinzel,serif;font-weight:900;font-size:clamp(13px,4.3vw,17px);letter-spacing:.06em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill{max-width:46vw}#locTxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#b9a98b}
.pill.live .dot{background:#2fb35a;box-shadow:0 0 0 3px rgba(47,179,90,.25)}
.pill.manual .dot{background:var(--gold2)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);display:grid;place-items:center;cursor:pointer;flex:none}
/* main */
main{position:fixed;left:0;right:0;top:calc(var(--hdr) + var(--sat));bottom:calc(var(--tab) + var(--sab))}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:24px}
.view.active{display:block}
#v-mapa{overflow:hidden;padding:0}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--sab));padding-bottom:var(--sab);display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);z-index:30}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--gold)}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(201,154,46,.35))}
/* generic */
.wrap{max-width:720px;margin:0 auto;padding:6px 12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.card h2{font-size:18px;margin-bottom:6px}
.card h3{font-size:15px;margin:12px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--paper2);border:1px solid var(--line);white-space:nowrap}
.chip.s{background:var(--crimson);color:#fff;border-color:transparent}
.chip.g{background:var(--gold);color:#fff;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#fff;border-color:transparent}
.btn.red{background:var(--crimson);color:#fff;border-color:transparent}
.btn.sm{min-height:36px;padding:0 11px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sep{height:1px;background:var(--line);margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.kv b{color:var(--muted);font-weight:600}
ul.clean{margin:6px 0;padding-left:18px}
ul.clean li{margin:4px 0}
.seg{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);background:var(--paper2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.badge{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;font-family:Inter,sans-serif}
/* map */
#map{width:100%;height:100%;display:block;touch-action:none;background:var(--sea);user-select:none;-webkit-user-select:none}
.m-sea{fill:var(--sea)} .m-waves{stroke:var(--sea2);fill:none;stroke-width:1.2;opacity:.8}
.m-land{fill:var(--land);stroke:var(--land2);stroke-width:1.5}
.m-contour{fill:none;stroke:var(--land2);stroke-width:1.2;opacity:.9}
.m-road{fill:none;stroke:var(--road);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.m-roadc{fill:none;stroke:var(--land2);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.m-old{fill:var(--old)} .m-hatch{stroke:var(--old2);stroke-width:1;opacity:.55}
.m-wall{fill:none;stroke:var(--wall);stroke-width:5;stroke-linejoin:round}
.m-wallo{fill:none;stroke:var(--walls);stroke-width:8;stroke-linejoin:round}
.m-fort{fill:var(--wall);stroke:var(--walls);stroke-width:2}
.m-street{fill:none;stroke:var(--road);stroke-width:2;opacity:.55;stroke-linecap:round}
.m-stradun{fill:none;stroke:var(--wall);stroke-width:4;stroke-linecap:round}
.m-cable{stroke:var(--label);stroke-width:1.6;stroke-dasharray:5 4;fill:none;opacity:.8}
.m-island{fill:var(--land);stroke:var(--land2);stroke-width:1.5}
.m-tree{fill:#7d9a5a;opacity:.35}
:root.dark .m-tree{fill:#56703c;opacity:.35}
.m-route{fill:none;stroke:var(--crimson);stroke-width:4;stroke-dasharray:9 7;stroke-linecap:round;opacity:.9}
.lbl{font-family:Cinzel,serif;font-weight:700;fill:var(--label);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.lbl.sea{fill:var(--sealabel);stroke:var(--sea);letter-spacing:.25em;font-weight:600}
.mk{cursor:pointer}
.mk .ring{fill:var(--paper);stroke:#fff;stroke-width:2.5}
.mk text{font-family:Inter,sans-serif;font-weight:800;font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk.sel .halo{opacity:1}
.mk .halo{opacity:0;fill:none;stroke:var(--gold2);stroke-width:4}
.pm circle{fill:#1f1a14;stroke:#fff;stroke-width:2}
.pm path{fill:#fff}
.me-acc{fill:var(--blue);opacity:.14;stroke:var(--blue);stroke-width:1;stroke-opacity:.4}
.me-dot{fill:var(--blue);stroke:#fff;stroke-width:3}
.me-cone{fill:var(--blue);opacity:.25}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.mapctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:20px}
.maptop{position:absolute;left:10px;top:10px;right:64px;display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.maptop>*{pointer-events:auto}
.floatchip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:34px;padding:0 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;font-weight:700;cursor:pointer}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;max-width:calc(100% - 80px)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 8px;opacity:.95}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
#near{position:absolute;left:10px;right:64px;bottom:10px;z-index:6;display:none;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--gold2);border-radius:14px;box-shadow:var(--shadow);padding:9px 12px;cursor:pointer;max-width:460px}
.mk text.mkl{display:none;font-family:Inter,sans-serif;font-weight:700;font-size:11.5px;fill:var(--label);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
#map.zoomed .mk text.mkl{display:block}
.welcome{background:var(--paper);border:1px solid var(--gold2);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;font-size:13.5px;max-width:420px}
.welcome b.t{font-family:Cinzel,serif;font-size:15px;display:block;margin-bottom:4px}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:39}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:86%;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:40;display:flex;flex-direction:column;padding-bottom:var(--sab)}
#sheet.open{transform:translateY(0)}
#sheet .grab{padding:8px 0 4px;display:grid;place-items:center;cursor:grab;touch-action:none}
#sheet .grab i{width:44px;height:5px;border-radius:5px;background:var(--line)}
#sheetBody{overflow-y:auto;padding:0 14px 18px;-webkit-overflow-scrolling:touch}
.shead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.shead h2{font-size:20px;line-height:1.15}
.alias{font-style:italic;color:var(--gold);font-weight:600;font-size:14px;margin-top:2px}
.scene{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.scene:first-of-type{border-top:0}
.scene .ep{flex:none;font-weight:800;font-size:12px;background:var(--crimson);color:#fff;border-radius:8px;padding:3px 6px;height:max-content;font-family:Inter,sans-serif}
.scene .ep.n{background:var(--muted)}
.scene em{color:var(--muted);font-size:12.5px;font-style:normal}
body.nospoil .spoil{filter:blur(6px);cursor:pointer}
body.nospoil .spoil.rev{filter:none}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 4px}
.quick a,.quick button{min-height:58px;border-radius:13px;border:1px solid var(--line);background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;text-decoration:none;color:var(--ink);cursor:pointer;padding:4px}
.quick .on{background:var(--ok);color:#fff;border-color:transparent}
.quick svg{width:22px;height:22px}
/* list */
.loc{display:flex;gap:11px;align-items:center;padding:12px;margin:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:15px;cursor:pointer}
.loc .info{flex:1;min-width:0}
.loc .nm{font-weight:700;font-size:15px;line-height:1.2}
.loc .al{font-size:12.5px;color:var(--gold);font-style:italic;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc .meta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.loc .dist{flex:none;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.loc .dist svg{display:block;margin:0 0 3px auto}
.loc.done{opacity:.72}
.loc.done .nm::after{content:" ✓";color:var(--ok)}
.prog{height:10px;border-radius:10px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--crimson));border-radius:10px;transition:width .4s}
/* compass */
.cwrap{display:grid;place-items:center;padding:6px 0}
#compass{width:min(86vw,330px);height:min(86vw,330px)}
.cbig{font-family:Cinzel,serif;font-weight:900;font-size:34px;line-height:1;text-align:center}
.csub{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}
.turn{font-weight:800;font-size:18px;text-align:center;margin-top:8px;color:var(--crimson)}
select{font:inherit;min-height:44px;width:100%;border-radius:12px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);padding:0 10px}
/* photos */
.ph{display:grid;grid-template-columns:96px 1fr;gap:12px}
.vf{width:96px;height:120px;border-radius:10px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.light{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);margin-top:8px;font-size:13px}
.light svg{flex:none}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.thumbs img,.album img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;cursor:pointer;background:var(--paper2)}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sunbar{display:flex;gap:10px;align-items:center}
.sunbar .big{font-weight:800;font-size:22px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:var(--paper);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(16px + var(--sab))}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sab) + 92px);transform:translate(-50%,30px);opacity:0;transition:.25s;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:70;max-width:92vw;box-shadow:var(--shadow);pointer-events:none;z-index:95}
#toast.top{bottom:auto;top:calc(var(--sat) + 110px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
/* quiz */
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);font-weight:600;cursor:pointer}
.qopt.right{background:var(--ok);color:#fff;border-color:transparent}
.qopt.wrong{background:var(--crimson);color:#fff;border-color:transparent}
.cur{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.cur:first-child{border-top:0}
.cur .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--paper2);border:1px solid var(--line);font-size:18px}
details{border-top:1px solid var(--line);padding:8px 0}
details:first-of-type{border-top:0}
summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:36px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--gold);font-weight:800}
details[open] summary::after{content:"－"}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
table.t td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.stop{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.stop:first-child{border-top:0}
.leg{font-size:12px;color:var(--muted);padding:2px 0 2px 38px}
/* câmera ao vivo */
#cam{position:fixed;inset:0;z-index:90;background:#000;display:none;color:#fff;touch-action:none}
#cam.on{display:block}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camOv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#camGhost *{fill:none!important;stroke:#fff!important;stroke-width:.7!important;vector-effect:non-scaling-stroke}
#camGhost .pp *{fill:#ffcc33!important;stroke:#000!important;stroke-width:.4!important}

tour1t:"📍 Sua localização",tour1p:"Toque aqui para <b>ligar o GPS</b>. Quando ficar <b style='color:#2fb35a'>verde</b>, o ponto azul te segue no mapa e o app avisa quando você chega numa locação. Ainda em casa? Aqui também tem o <b>🧪 Modo teste</b>.",tour1f:"Aqui você marca onde está. <b>Dentro do app do Claude o GPS é bloqueado</b> — para ter GPS ao vivo, abra o site no Safari ou Chrome.",

tour4t:"📡 Radar AR",tour4p:"Abre a câmera em <b>realidade aumentada</b>: aponte o celular e as locações aparecem flutuando na direção certa, com a distância. Toque numa etiqueta para ver a cena.",
tour5t:"📷 Pontos de foto",tour5p:"Mostra no mapa <b>onde ficar</b> para cada foto clássica. O leque dourado aponta para onde virar a câmera.",
tour6t:"📋 Locais",tour6p:"As 20 locações numa lista, da mais perto para a mais longe, com seta e minutos a pé. Marque <b>“Visitei”</b> e acompanhe sua conquista.",
tour7t:"🧭 Bússola",tour7p:"Escolha um destino e siga a <b>seta vermelha</b>. Toque em “Bússola ao vivo” para a seta girar junto com o celular.",
tour8t:"📸 Fotos",tour8p:"15 <b>missões de foto</b>: onde ficar, lente, uma pose para recriar a cena e um <b>planejador</b> que mostra a luz em qualquer horário do dia da sua visita. <b>“Câmera com guia”</b> abre a câmera com grade, silhueta, nível e mira 🎯.",
tour9t:"⚔️ Roteiros e mais",tour9p:"Roteiros com <b>modo guiado</b> parada por parada (comece pela Caminhada da Vergonha — tem até o sino 🔔), ingressos de 2026, regras da cidade, curiosidades e quiz.",
tour10t:"Pronto para a conquista!",tour10p:"Dica de ouro: toque em <b>Compartilhar → “Adicionar à Tela de Início”</b>. O guia vira app e funciona até <b>sem internet</b>.",tour10f:"Lembre: aqui dentro do Claude o GPS e a câmera ao vivo ficam bloqueados. Para a experiência completa, abra o site."

rulesTitle:"Regeln & goldene Tipps",rulesHTML:"<li><b>Badekleidung oder oben ohne</b> in den Gassen der Altstadt kostet Strafe (ca. 150 €). Den Walk of Shame also bitte angezogen nachstellen!</li><li><b>Rollkoffer:</b> Die Stadt hat die berühmte „Strafe“ dementiert; es gibt kein offizielles Verbot, aber Tragen ist netter zu den Anwohnern.</li><li><b>Drohnen</b> über der Altstadt brauchen eine Genehmigung.</li><li>Das Kalkstein-Pflaster ist <b>rutschig</b>: Schuhe mit gutem Grip.</li><li>Kreuzfahrt-Ansturm: <b>10–14 Uhr</b>. Die berühmten Spots um 8 Uhr oder nach 16 Uhr besuchen.</li><li>Kroatien zahlt in <b>Euro</b>; Leitungs- und Brunnenwasser ist trinkbar.</li>",

helpHTML:"<li><b>GPS:</b> oben auf den Positions-Button tippen → GPS einschalten. Grün = läuft. Aus Versehen abgelehnt? iPhone → Einstellungen → Datenschutz → Ortungsdienste → Safari-Websites → „Beim Verwenden“; Android → Schloss neben der Adresse → Standort.</li><li><b>Kompass:</b> Tab Kompass → „Live-Kompass“. Auf dem iPhone wird „Bewegung & Ausrichtung“ abgefragt. Spinnt der Pfeil, das Handy in einer Acht bewegen.</li><li><b>Noch zu Hause?</b> Schalte den <b>🧪 Testmodus</b> ein und tippe auf die Karte, um durch Dubrovnik zu „gehen“.</li><li><b>Kamera mit Guide:</b> folge Raster, Szenen-Umriss und dem Pfeil „X° drehen“. Wird „GERADE“ grün, ist dein Foto gerade.</li><li><b>Offline:</b> Website einmal im WLAN öffnen und „Zum Home-Bildschirm“ wählen — dann startet sie wie eine App, auch offline.</li>",

tour1t:"📍 Dein Standort",tour1p:"Tippe hier, um <b>GPS einzuschalten</b>. Wird es <b style='color:#2fb35a'>grün</b>, folgt dir der blaue Punkt auf der Karte und die App meldet sich an jedem Drehort. Noch zu Hause? Hier gibt's auch den <b>🧪 Testmodus</b>.",tour1f:"Hier setzt du deine Position. <b>In der Claude-App ist GPS blockiert</b> — für Live-GPS die Website in Safari oder Chrome öffnen.",
tour2t:"🗺️ Die Pins",tour2p:"Jeder nummerierte Pin ist ein Drehort. Die Farbe zeigt die Art: <b style='color:var(--c-cidade)'>Altstadt</b>, <b style='color:var(--c-muralhas)'>Mauern</b>, <b style='color:var(--c-arredores)'>Umgebung</b> und <b style='color:var(--c-excursao)'>Ausflüge</b>. <b>Tippe auf einen Pin</b> für Szene, Geschichte und Weg.",
tour3t:"🎯 Wo bin ich",tour3p:"Zentriert die Karte auf dich. Mit GPS nochmal tippen, dann <b>folgt dir die Karte</b> beim Gehen.",
tour4t:"📡 AR-Radar",tour4p:"Öffnet die Kamera in <b>Augmented Reality</b>: richte das Handy aus und die Drehorte schweben in der richtigen Richtung, mit Entfernung. Tippe auf ein Label für die Szene.",
tour5t:"📷 Fotospots",tour5p:"Zeigt auf der Karte, <b>wo du stehen musst</b> für jedes klassische Foto. Der goldene Fächer zeigt, wohin die Kamera zeigen soll.",
tour6t:"📋 Orte",tour6p:"Alle 20 Drehorte in einer Liste, der nächste zuerst, mit Pfeil und Gehminuten. Tippe <b>„War hier“</b> und verfolge deine Eroberung.",
tour7t:"🧭 Kompass",tour7p:"Wähle ein Ziel und folge dem <b>roten Pfeil</b>. Tippe auf „Live-Kompass“, damit sich der Pfeil mit dem Handy dreht.",
tour8t:"📸 Fotos",tour8p:"15 <b>Foto-Missionen</b>: wo stehen, welches Objektiv, eine Pose zum Nachstellen und ein <b>Planer</b>, der das Licht zu jeder Uhrzeit an deinem Besuchstag zeigt. <b>„Kamera mit Guide“</b> öffnet die Kamera mit Raster, Umriss, Wasserwaage und 🎯-Ziel.",
tour9t:"⚔️ Routen & mehr",tour9p:"Routen mit <b>geführtem Modus</b> Stopp für Stopp (fang mit dem Walk of Shame an — sogar mit Glocke 🔔), Tickets 2026, Stadtregeln, Wissenswertes und ein Quiz.",
tour10t:"Bereit zur Eroberung!",tour10p:"Goldener Tipp: tippe auf <b>Teilen → „Zum Home-Bildschirm“</b>. Der Guide wird zur App und funktioniert sogar <b>offline</b>.",tour10f:"Denk dran: In der Claude-App sind GPS und Live-Kamera blockiert. Für das volle Erlebnis die Website öffnen."

CUR:[
"In season 1, King’s Landing was Malta. The production moved to Dubrovnik from season 2, partly to cut costs.",
"The show filmed in Dubrovnik from 2011 to 2018, seasons 2 to 8. According to the local tourist board, Benioff and Weiss picked the city because it matched the books’ description of King’s Landing.",
"The Walk of Shame used body double Rebecca Van Cleave (chosen from over a thousand candidates); Lena Headey walked beside her in a beige robe. Three days of filming, with hoardings along the route.",
"HBO wanted to film the Walk in front of St Nicholas Church, but the church refused — which is why the scene uses four different places.",
"In “The Bells”, King’s Landing burns on a set in Belfast: you can’t set fire to a UNESCO World Heritage site.",
"For season 8 the crew filmed at least one fake Jon-and-Cersei scene in Dubrovnik just to throw off spoiler hunters.",
"At the Purple Wedding, the ceremony was in the studio (the Sept of Baelor in Belfast); only the feast was outdoors, in Gradac.",
"In the Gold Cloaks scene at the west harbour, local kids swimming nearby were kept in shot.",
"At the Belvedere, the Baratheon crest painted for the fight was later covered by locals with the Hajduk Split badge.",
"The Belvedere ran for only six seasons, from 1985 to 1991. Bought in 2014 by a Russian billionaire, it’s still in ruins in 2026.",
"The spin-off House of the Dragon didn’t film in Dubrovnik — it went to Spain, Portugal and the UK.",
"Backpacker legend: City Walls Hostel has a sign saying Peter Dinklage slept on the sofa after a night out. Nobody confirms it — but the story gets around.",
"A study quoted in the Croatian press estimated that visitors drawn by the show spent €126 million in Dubrovnik between 2012 and 2015.",
"Dubrovnik was also the casino city of Canto Bight in Star Wars: The Last Jedi and a set for Robin Hood (2018)."
],

CUR:[
"In Staffel 1 war Königsmund noch Malta. Ab Staffel 2 zog die Produktion nach Dubrovnik, auch um Kosten zu sparen.",
"Die Serie drehte von 2011 bis 2018 in Dubrovnik, Staffel 2 bis 8. Laut Tourismusverband wählten Benioff und Weiss die Stadt, weil sie zur Beschreibung von Königsmund in den Büchern passte.",
"Für den Walk of Shame wurde das Body-Double Rebecca Van Cleave eingesetzt (aus über tausend Bewerberinnen); Lena Headey ging in beiger Robe nebenher. Drei Drehtage, mit Bauzäunen entlang der Strecke.",
"HBO wollte den Walk vor der Nikolauskirche drehen, doch die Kirche lehnte ab — deshalb nutzt die Szene vier verschiedene Orte.",
"In „The Bells“ brennt Königsmund in einem Studio in Belfast: Ein UNESCO-Welterbe zündet man nicht an.",
"Für Staffel 8 drehte das Team in Dubrovnik mindestens eine falsche Szene mit Jon und Cersei, nur um Spoiler-Jäger zu täuschen.",
"Bei der Purpurnen Hochzeit fand die Trauung im Studio statt (die Septe von Baelor in Belfast); nur das Festmahl war draußen in Gradac.",
"Bei der Goldröcke-Szene am Westhafen blieben einheimische Kinder, die dort schwammen, im Bild.",
"Am Belvedere übermalten Einheimische das für den Kampf gemalte Baratheon-Wappen mit dem Wappen von Hajduk Split.",
"Das Belvedere lief nur sechs Saisons, von 1985 bis 1991. 2014 von einem russischen Milliardär gekauft, ist es 2026 noch immer eine Ruine.",
"Das Spin-off House of the Dragon drehte nicht in Dubrovnik — sondern in Spanien, Portugal und Großbritannien.",
"Backpacker-Legende: Im City Walls Hostel hängt ein Schild, laut dem Peter Dinklage nach einer Partynacht auf dem Sofa schlief. Bestätigt hat das niemand — aber die Geschichte macht die Runde.",
"Laut einer von der kroatischen Presse zitierten Studie gaben durch die Serie angelockte Besucher zwischen 2012 und 2015 in Dubrovnik 126 Mio. € aus.",
"Dubrovnik war auch die Casinostadt Canto Bight in Star Wars: Die letzten Jedi und Kulisse für Robin Hood (2018)."
],

CUR:[
"Dans la saison 1, Port-Réal, c'était Malte. La production s'est installée à Dubrovnik à partir de la saison 2, en partie pour réduire les coûts.",
"La série a tourné à Dubrovnik de 2011 à 2018, des saisons 2 à 8. Selon l'office de tourisme, Benioff et Weiss ont choisi la ville car elle collait à la description de Port-Réal dans les livres.",
"La Marche de la honte a utilisé la doublure Rebecca Van Cleave (choisie parmi plus de mille candidates) ; Lena Headey marchait à côté en robe beige. Trois jours de tournage, avec des palissades le long du parcours.",
"HBO voulait tourner la Marche devant l'église Saint-Nicolas, mais l'église a refusé — d'où l'utilisation de quatre lieux différents.",
"Dans « The Bells », Port-Réal brûle sur un plateau à Belfast : on ne met pas le feu à un site classé par l'UNESCO.",
"Pour la saison 8, l'équipe a tourné à Dubrovnik au moins une fausse scène avec Jon et Cersei, juste pour tromper les chasseurs de spoilers.",
"Aux Noces Pourpres, la cérémonie a eu lieu en studio (le Septuaire de Baelor à Belfast) ; seul le festin était en extérieur, à Gradac.",
"Dans la scène des manteaux d'or au port ouest, des enfants du coin qui nageaient là ont été gardés dans le cadre.",
"Au Belvedere, le blason des Baratheon peint pour le combat a été recouvert par des habitants avec l'écusson du Hajduk Split.",
"Le Belvedere n'a fonctionné que six saisons, de 1985 à 1991. Racheté en 2014 par un milliardaire russe, il est toujours en ruine en 2026.",
"La série dérivée House of the Dragon n'a pas tourné à Dubrovnik — elle est allée en Espagne, au Portugal et au Royaume-Uni.",
"Légende de routards : le City Walls Hostel affiche un panneau disant que Peter Dinklage a dormi sur le canapé après une soirée. Personne ne confirme — mais l'histoire circule.",
"Une étude citée par la presse croate estime que les visiteurs attirés par la série ont dépensé 126 millions d'euros à Dubrovnik entre 2012 et 2015.",
"Dubrovnik a aussi été la ville-casino de Canto Bight dans Star Wars : Les Derniers Jedi et le décor de Robin des Bois (2018)."
],

TRB.it={
L:{
gradac:{name:"Parco Gradac",got:"Banchetto del Matrimonio Viola",
 sc:["Il banchetto delle nozze di Joffrey e Margaery. Joffrey viene avvelenato, muore tra le braccia di Cersei e Tyrion finisce arrestato.","La fuga di Sansa con ser Dontos comincia qui, passa per i vicoli della città vecchia e finisce sulla costa di Trsteno."],
 real:"Il parco pubblico più grande e antico di Dubrovnik (aperto nel 1898), in cima alle scogliere sopra la spiaggia di Danče, pieno di pini e con vista sul Lovrijenac e sulla città vecchia.",
 curios:["La cerimonia nuziale è stata girata in un set a Belfast; a Gradac solo il banchetto.","Per allestire il set la produzione chiuse il parcheggio accanto — e il traffico della città rimase bloccato per giorni.","Nel 2026 il parco ha riaperto dopo la prima ristrutturazione completa in quasi 130 anni, con un nuovo percorso pedonale."],
 tips:["Gratis e sempre aperto.","10–15 min di salita dalla porta Pile; porta acqua d'estate.","I prati del banchetto non hanno cartelli — il belvedere all'ingresso, vicino al laghetto, è il punto del set."]},
lovr:{name:"Fortezza Lovrijenac",got:"La Fortezza Rossa",
 sc:["Il torneo per l'onomastico di Joffrey: ser Dontos arriva ubriaco, Joffrey ordina di ucciderlo e Sansa lo salva proponendo di farne il buffone di corte.","“Il potere è potere”: Cersei fa puntare dalle guardie una lama alla gola di Ditocorto per mostrare chi comanda."],
 real:"Fortezza su una rupe di 37 m fuori dalle mura occidentali. Soprannominata la “Gibilterra di Dubrovnik”, sorvegliava gli accessi via mare e via terra.",
 curios:["Sopra la porta c'è il motto “Non bene pro toto libertas venditur auro”: la libertà non si vende nemmeno per tutto l'oro del mondo.","Si racconta che arrivarono navi veneziane cariche di materiale per costruire un proprio forte — e furono rimandate a Venezia.","È il palco classico dell'Amleto al Festival estivo di Dubrovnik e ha ospitato il Red Bull Cliff Diving."],
 tips:["Biglietto singolo 15 € (2026), oppure incluso in quello delle mura (40 €).","Orari: giu–set 8–19:30; nov–mar 8–15.","Salita breve e ripida; calcola 30–45 min. Foto migliori prima delle 9:30 o dopo le 17."]},
pilebay:{name:"Baia di Pile e molo ovest",got:"Porto di Approdo del Re · Baia delle Acque Nere",
 sc:["Le cappe dorate scendono le scale del porto ovest a caccia dei bastardi di Robert.","La corte saluta Myrcella sul molo quando parte per Dorne.","Shae osserva Sansa che parla con Ditocorto di un piano di fuga.","Cersei aspetta sulla riva la nave che riporta il corpo di Myrcella.","Jon saluta Sansa, Arya e Bran (secondo il sito di fan King’s Landing Dubrovnik)."],
 real:"Piccola baia tra il Lovrijenac e la fortezza Bokar, appena fuori dalla porta Pile. D'estate partono da qui i kayak.",
 curios:["Durante la scena del massacro, alcuni bambini del posto nuotavano lì vicino — al regista piacque e li lasciò nell'inquadratura.","La produzione dovette risarcire le società di kayak per le ore perse.","In varie inquadrature la Fortezza Rossa è stata “ingrandita” in computer grafica; dal vero vedi il porto."],
 tips:["Gratis. Circa 5 min a piedi dal Lovrijenac e dalla porta Pile."]},
pile:{name:"Porta Pile",got:"Porta di Approdo del Re",
 sc:["La rivolta di Approdo del Re: la folla affamata circonda il corteo, Joffrey riceve sterco in faccia, ordina di ucciderli tutti — e la città esplode.","Jaime, finalmente libero, torna ad Approdo del Re."],
 real:"L'ingresso principale della città vecchia; la forma attuale è del 1537. Il ponte levatoio veniva alzato ogni sera e la chiave consegnata al rettore. Sopra l'arco, la statua di San Biagio (Sveti Vlaho), il patrono.",
 curios:["Le stagioni 2 e 3 hanno usato tutti e quattro gli angoli della porta in scene diverse."],
 tips:["Collo di bottiglia tra le 10 e le 16, quando arrivano i croceristi.","Subito dopo la porta c'è l'ingresso principale delle mura."]},
minceta:{name:"Torre Minčeta",got:"Casa degli Eterni (Qarth)",
 sc:["Daenerys, Jorah e Kovarro arrivano alla Casa degli Eterni e girano attorno alla torre cercando l'ingresso per salvare i draghi rubati."],
 real:"Il punto più alto delle mura. Nata quadrata nel 1319, divenne l'attuale torre rotonda nel XV secolo, con Michelozzo e Juraj Dalmatinac. Il nome viene dalla famiglia Menčetić, proprietaria del terreno.",
 curios:["Nel febbraio 2018 la troupe tornò alla Minčeta per girare l'8ª stagione."],
 tips:["Fa parte del giro delle mura (biglietto 40 €). Sali le scale interne: la vista sui tetti è la migliore della città."]},
walls:{name:"Mura — tratto sul mare",got:"Mura di Approdo del Re",
 sc:["Tyrion, Bronn e Pod camminano sulle mura mentre gli operai riparano i danni delle Acque Nere.","La Montagna prova la spada sui prigionieri e Cersei ringrazia il suo campione.","Tommen suggerisce a Cersei di tornare a Castel Granito; lei rifiuta.","Qyburn dice a Cersei che la Barriera è caduta mentre la Flotta di Ferro entra nella baia.","Jon viene liberato e lascia Approdo del Re diretto ai Guardiani della Notte."],
 real:"Circa 1,94 km di mura continue, alte fino a 25 m, con una serie di fortezze e torri. Patrimonio UNESCO dal 1979.",
 curios:["Il giro si fa in senso antiorario: Pile → Minčeta → porto → mare → Bokar."],
 tips:["40 € adulti · 15 € (7–18 anni) · gratis sotto i 7 (2026). Include il Lovrijenac.","Un solo giro, senza rientro. 1h30–2h con le soste.","Aperte tutti i giorni tranne il 25/12; orari variabili per stagione (inverno ~9–15; estate ~8–19:30).","Ingressi: Pile, forte di San Giovanni e forte di San Luca. Quasi niente ombra: acqua e cappello."]},
bokar:{name:"Fortezza Bokar",got:"Dove Tyrion pianifica le Acque Nere",
 sc:["Tyrion e Varys guardano il mare e discutono la difesa contro la flotta di Stannis.","Nello stesso punto, Cersei dice a Jaime che vuole allearsi con Euron Greyjoy.","Daenerys atterra con Drogon sul Bokar e decide di bruciare la città, anche mentre suonano le campane della resa."],
 real:"Fortezza rotonda iniziata nel 1461 dal fiorentino Michelozzo, spesso citata come la più antica fortezza casamattata conservata d'Europa. Una parte poggia su una roccia staccata, con un arco sotto cui passa il mare.",
 curios:["Nella scena della 2ª stagione il Lovrijenac sullo sfondo è stato potenziato digitalmente — dal vero la vista è più modesta."],
 tips:["Ci si arriva solo dalle mura. Guarda il Lovrijenac dall'altra parte della baia."]},

 real:"Scalinata barocca progettata da Pietro Passalacqua (1735–1738), ispirata a Trinità dei Monti a Roma. Sale da piazza Gundulić alla chiesa di Sant'Ignazio e all'antico collegio dei Gesuiti.",
 curios:["Il corpo nudo nella scena è della controfigura Rebecca Van Cleave, scelta tra oltre mille candidate. Lena Headey camminava accanto con una tunica beige e il suo volto è stato aggiunto in digitale.","La sequenza ha richiesto 3 giorni di riprese e il percorso fu recintato con pannelli per garantire la privacy.","Una chiesa locale cercò di bloccare le riprese; HBO voleva la chiesa di San Nicola, che rifiutò.","Dopo le mura è il luogo più visitato della città — e ha avuto il primo grande restauro dal 1735."],
 tips:["Gratis, sempre accessibile. Arriva presto per trovarla senza gente.","Gradini irregolari: attenzione quando indietreggi per la foto."]},

const DB={mem:[],db:null,ok:true,
 open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('portoreal',1)}catch(e){this.ok=false;rej(e);return}
  r.onupgradeneeded=()=>{try{r.result.createObjectStore('fotos',{keyPath:'id'})}catch(e){}};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>{this.ok=false;rej(r.error)}})},
 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('fotos',mode);const st=t.objectStore('fotos');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)})},
 async put(o){try{await this.tx('readwrite',s=>s.put(o))}catch(e){this.mem.push(o)}},
 async all(){try{const r=await this.tx('readonly',s=>s.getAll());return (r||[]).concat(this.mem)}catch(e){return this.mem.slice()}},
 async del(id){try{await this.tx('readwrite',s=>s.delete(id))}catch(e){}this.mem=this.mem.filter(x=>x.id!==id)}};

/* modo guiado: uma parada por vez */
function guide(rid,i){const r=ROUTES.find(x=>x.id===rid);const id=r.stops[i];const l=LBY[id];const nx=r.stops[i+1]?LBY[r.stops[i+1]]:null;
 const here=S.pos&&dist(S.pos,l)<40;const from=S.pos||(i>0?LBY[r.stops[i-1]]:null);
 const d=from?dist(from,l):null,b=from?bearing(from,l):0;const sc=l.scenes[0];
 S.route=rid;S.guiding=true;keepAwake(true);drawRoute();
 openSheet(`<div class="shead"><span class="badge" style="background:var(--c-${l.cat})">${l.n}</span><div style="flex:1;min-width:0"><div class="small muted">${t('stopOf',esc(r.name),i+1,r.stops.length)}</div><h2>${esc(l.name)}</h2><div class="alias">${esc(l.got)}</div></div><button class="iconbtn" onclick="S.guiding=false;closeSheet()" aria-label="${t('close')}">✕</button></div>
 <div class="prog" style="margin:4px 0 10px"><i style="width:${Math.round((i+1)/r.stops.length*100)}%"></i></div>
 ${d!=null&&!here?`<div class="light" style="margin-top:0">${arrowSVG(b,30)}<div><b>${fmtD(d)} · ${card(b)}</b> ${S.pos?t('fromYou'):t('fromPrev')}<br><span class="muted">${t('walkMin',walk(d))}</span></div></div>`:here?`<div class="light" style="margin-top:0">✅ <b>${t('youAreHereB')}</b></div>`:''}
 <div class="quick" style="grid-template-columns:repeat(3,1fr)"><a href="${gmaps(l.lat,l.lon)}" target="_blank" rel="noopener">${IC.nav}${t('goGoogle')}</a><a href="${amaps(l.lat,l.lon,l.name)}" target="_blank" rel="noopener">${IC.apple}${t('goApple')}</a><button onclick="setTarget('${id}')">${IC.comp}${t('tabCompass')}</button></div>
 ${sc?`<div class="scene" style="border:0"><span class="ep ${sc[0]?'':'n'}">${epTag(sc)}</span><div class="spoil" onclick="this.classList.add('rev')">${sc[0]?`<em>“${esc(sc[2])}”</em><br>`:''}${esc(sc[3])}</div></div>`:''}
 ${rid==='vergonha'?`<button class="btn sm red" style="width:100%;margin-top:6px" onclick="shameBell()">🔔 ${t('bellBtn2')}</button>`:''}
 ${l.curios[0]?`<div class="hint" style="margin-top:6px">💡 ${esc(l.curios[0])}</div>`:''}
 ${PH.some(p=>p.loc===id)?`<div class="row" style="margin-top:10px">${PH.filter(p=>p.loc===id).map(p=>`<button class="btn sm" onclick="openPhoto('${p.id}')">📷 ${esc(p.title)}</button>`).join('')}</div>`:''}
 <div class="grid2" style="margin-top:14px">${i>0?`<button class="btn" onclick="guide('${rid}',${i-1})">← ${t('prev')}</button>`:'<span></span>'}
 <button class="btn gold" onclick="guideArrive('${rid}',${i})">${nx?t('arrivedNext'):t('arrivedEnd')}</button></div>
 <button class="btn sm" style="margin-top:8px;width:100%" onclick="openLoc('${id}')">${t('seeAll')}</button>`)}
function guideArrive(rid,i){const r=ROUTES.find(x=>x.id===rid);const id=r.stops[i];if(!S.visited.has(id)){S.visited.add(id);store.set('visited',[...S.visited]);drawMarkers()}
 if(S.posSrc!=='gps')setManualPos(LBY[id],LBY[id].name,true);
 if(r.stops[i+1])guide(rid,i+1);else{S.guiding=false;keepAwake(false);closeSheet();toast('🏆 '+t('routeDone',esc(r.name)),4000)}}
function renderQuiz(){const el=$('#quizCard');if(!el)return;if(!quizState){el.innerHTML=`<h2>${t('quizTitle')}</h2><p class="small muted" style="margin-top:0">${t('quizP',QUIZ.length)}</p><button class="btn gold" id="qStart">⚔️ ${t('start')}</button>`;$('#qStart').onclick=()=>{quizState={i:0,ok:0};renderQuiz()};return}
 const q=QUIZ[quizState.i];if(quizState.i>=QUIZ.length||!q){const sc=quizState.ok;const title=sc>=9?t('rank1'):sc>=6?t('rank2'):sc>=3?t('rank3'):t('rank4');
  el.innerHTML=`<h2>${t('result')}</h2><div class="cbig" style="margin:10px 0">${sc}/${QUIZ.length}</div><p style="text-align:center;margin:0">${title}</p><div style="text-align:center;margin-top:10px"><button class="btn gold" id="qAgain">${t('playAgain')}</button></div>`;$('#qAgain').onclick=()=>{quizState={i:0,ok:0};renderQuiz()};return}
 el.innerHTML=`<div style="display:flex;justify-content:space-between"><h2 style="font-size:16px">${t('questionN',quizState.i+1,QUIZ.length)}</h2><span class="chip">${t('hits',quizState.ok)}</span></div><p style="font-weight:600">${esc(q[0])}</p>${q[1].map((o,i)=>`<button class="qopt" data-i="${i}">${esc(o)}</button>`).join('')}<div id="qExp" class="small" style="margin-top:6px"></div>`;
 $$('.qopt',el).forEach(b=>b.onclick=()=>{if(quizState.ans!=null)return;const i=+b.dataset.i;quizState.ans=i;if(i===q[2])quizState.ok++;
  $$('.qopt',el).forEach(x=>{const j=+x.dataset.i;if(j===q[2])x.classList.add('right');else if(j===i)x.classList.add('wrong')});
  $('#qExp').innerHTML=`${i===q[2]?'✅ '+t('correct'):'❌ '+t('almost')} ${esc(q[3])}<div style="margin-top:8px"><button class="btn sm gold" id="qNext">${t('next')}</button></div>`;
  $('#qNext').onclick=()=>{quizState.i++;quizState.ans=null;renderQuiz()}})}
function openLangModal(){modal(`<h2 style="font-size:19px">🌐 ${t('language')}</h2><div class="grid2" style="margin-top:10px">${Object.entries(LANGS).map(([k,v])=>`<button class="btn ${k===LANG?'gold':''}" data-lg="${k}">${v}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" data-close>${t('close')}</button>`);
 $$('[data-lg]',$('#modalBox')).forEach(b=>b.onclick=()=>{closeModal();setLang(b.dataset.lg)})}
/* ============ tutorial guiado ============ */
const TOUR=[
 {c:1,icon:'👑',k:0,next:'tourStart',langs:1},
 {sel:'#locPill',k:1,framedAlt:1},
 {sel:()=>$('#gMarkers .mk[data-id="jesuit"]'),pad:12,before:()=>{closeSheet();fitOld()},k:2},
 {sel:'#zMe',k:3},
 {sel:'#zAR',k:4},
 {sel:'#zLayer',k:5},
 {sel:'#tabs [data-v="locais"]',k:6},
 {sel:'#tabs [data-v="bussola"]',k:7},
 {sel:'#tabs [data-v="fotos"]',k:8},
 {sel:'#tabs [data-v="mais"]',k:9},
 {c:1,icon:'🏰',k:10,last:true,framedAlt:1}
];
let tourI=0;
function startTour(i){store.set('welcomed',true);renderMapTop();closeSheet();closeModal();tourI=i||0;$('#tour').classList.add('on');showTour()}
function endTour(){$('#tour').classList.remove('on');store.set('toured',true)}
function showTour(){const st=TOUR[tourI];if(!st){endTour();return}if(st.before)st.before();
 requestAnimationFrame(()=>requestAnimationFrame(()=>placeTour(st)))}
function placeTour(st){const spot=$('#tourSpot'),cardEl=$('#tourCard'),W=innerWidth,H=innerHeight;
 const el=st.sel?(typeof st.sel==='function'?st.sel():$(st.sel)):null;let r=el&&el.getBoundingClientRect();if(r&&(r.width===0||r.bottom<0||r.top>H))r=null;
 const title=t('tour'+st.k+'t'),p=FRAMED&&st.framedAlt?t('tour'+st.k+'f'):t('tour'+st.k+'p');const dots=TOUR.map((_,i)=>`<i class="${i===tourI?'on':''}"></i>`).join('');
 let btns;if(st.last){btns=FRAMED?`<a class="btn gold" href="${HOSTED_URL}?lang=${LANG}" target="_blank" rel="noopener">📡 ${t('openSite')}</a><button class="btn" id="tDone">${t('begin')}</button>`
   :`<button class="btn gold" id="tGps">📡 ${t('enableGps')}</button><button class="btn" id="tSim">🧪 ${t('testAtHome')}</button><button class="btn" id="tDone">${t('begin')}</button>`}
 else btns=`${tourI>0?`<button class="btn sm" id="tBack">${t('back')}</button>`:''}<button class="btn gold sm" id="tNext">${st.next?t(st.next):t('nextArrow')}</button>`;
 const langs=st.langs?`<div class="tlangs">${Object.entries(LANGS).map(([k,v])=>`<button data-lg="${k}" class="${k===LANG?'on':''}">${v}</button>`).join('')}</div>`:'';
 cardEl.innerHTML=`${st.icon?`<div class="tbig">${st.icon}</div>`:''}<div class="tdots" style="justify-content:${st.c?'center':'flex-start'};margin-top:${st.icon?'10px':'0'}">${dots}</div><h3 class="serif" style="text-align:${st.c?'center':'left'}">${title}</h3><p style="text-align:${st.c?'center':'left'}">${p}</p>${langs}
  <div class="tbar" style="${st.last?'flex-wrap:wrap;justify-content:center':''}">${st.last?'':`<button class="tskip" id="tSkip">${t('tourSkip')}</button>`}${btns}</div>`;
 cardEl.style.animation='none';void cardEl.offsetWidth;cardEl.style.animation='';
 if(r){const pad=st.pad||6;spot.classList.remove('none');Object.assign(spot.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
  const below=r.top+r.height/2<H*0.5;cardEl.style.top=below?(r.bottom+pad+14)+'px':'auto';cardEl.style.bottom=below?'auto':(H-r.top+pad+14)+'px'}
 else{spot.classList.add('none');cardEl.style.bottom='auto';cardEl.style.top='0';const ch=cardEl.offsetHeight;cardEl.style.top=Math.max(20,(H-ch)/2)+'px'}
 const q=s=>$(s,cardEl);
 if(q('#tNext'))q('#tNext').onclick=()=>{tourI++;showTour()};if(q('#tBack'))q('#tBack').onclick=()=>{tourI--;showTour()};if(q('#tSkip'))q('#tSkip').onclick=endTour;
 if(q('#tDone'))q('#tDone').onclick=endTour;if(q('#tGps'))q('#tGps').onclick=()=>{endTour();startGPS(true);startCompass(true)};
 if(q('#tSim'))q('#tSim').onclick=()=>{endTour();setSim(true,'pile');setTimeout(()=>centerOn(LBY.pile.lat,LBY.pile.lon,1.4,true),60)};
 $$('[data-lg]',cardEl).forEach(b=>b.onclick=()=>{setLang(b.dataset.lg);placeTour(TOUR[tourI])})}
window.addEventListener('resize',()=>{if($('#tour').classList.contains('on'))placeTour(TOUR[tourI])});
/* ============ idioma: aplica textos traduzidos ============ */
function snapshotPT(){PH.forEach(p=>{p.vert=p.orient.startsWith('Vertical');p.lensIdx=p.lens.startsWith('0,5')?0:p.lens.startsWith('2×')?2:1});
 return {L:L.map(l=>({name:l.name,got:l.got,real:l.real,curios:l.curios,tips:l.tips,sc:l.scenes.map(s=>s[3]),sct:l.scenes.map(s=>s[2])})),
 PH:PH.map(p=>({title:p.title,where:p.where,how:p.how,best:p.best,recreate:p.recreate,lens:p.lens,orient:p.orient})),
 R:ROUTES.map(r=>({name:r.name,time:r.time,desc:r.desc})),CUR:CUR.map(c=>c[1]),QUIZ:QUIZ.slice(),LABELS:LABELS.map(l=>l.t)}}
function drawLabels(){$('#gLabels').innerHTML=LABELS.map(l=>{const p=xy(l.lat,l.lon);return `<g class="cs" data-x="${f1(p[0])}" data-y="${f1(p[1])}"><text class="lbl ${l.c}" font-size="${l.s}" text-anchor="middle">${esc(l.t)}</text></g>`}).join('');refreshCS()}
function setLang(lang,initial){if(!LANGS[lang])lang='en';LANG=lang;store.set('lang',lang);
 const B=lang==='pt'?null:(TRB[lang]||null);
 L.forEach((l,i)=>{const o=(B&&B.L&&B.L[l.id])||{},p=PT0.L[i];l.name=o.name||p.name;l.got=o.got||p.got;l.real=o.real||p.real;l.curios=o.curios||p.curios;l.tips=o.tips||p.tips;
  l.scenes.forEach((s,j)=>{s[3]=(o.sc&&o.sc[j])||p.sc[j];if(!s[0])s[2]=(o.sct&&o.sct[j])||p.sct[j]})});
 PH.forEach((ph,i)=>{const o=(B&&B.PH&&B.PH[ph.id])||{},p=PT0.PH[i];['title','where','how','best','recreate','lens','orient'].forEach(f=>{ph[f]=o[f]||p[f]})});
 ROUTES.forEach((r,i)=>{const o=(B&&B.R&&B.R[r.id])||{},p=PT0.R[i];['name','time','desc'].forEach(f=>{r[f]=o[f]||p[f]})});
 CUR.forEach((c,i)=>{c[1]=(B&&B.CUR&&B.CUR[i])||PT0.CUR[i]});
 QUIZ.length=0;((B&&B.QUIZ)||PT0.QUIZ).forEach(q=>QUIZ.push(q));
 LABELS.forEach((lb,i)=>{lb.t=(B&&B.LABELS&&B.LABELS[i])||PT0.LABELS[i]});
 document.documentElement.lang=LOCALE[lang];document.title=t('docTitle');
 $$('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});$$('[data-i18n-aria]').forEach(e=>{const v=t(e.dataset.i18nAria);e.setAttribute('aria-label',v);if(e.hasAttribute('title'))e.title=v});
 $('#langCode').textContent=lang.toUpperCase();if(typeof fitBrand==='function')requestAnimationFrame(fitBrand);
 drawLabels();drawMarkers();renderLegend();
 if(!initial){quizState=null;updatePosUI(true);closeSheet();if(cur!=='mapa')go(cur);toast('🌐 '+LANGS[lang])}}

/* ============ início ============ */
const PT0=snapshotPT();
buildMap();
setLang(LANG,true);
$('#langHdr').onclick=openLangModal;
// nome da cidade cabe no topo em qualquer idioma (encolhe a fonte se precisar)
function fitBrand(){const b=$('.brand b');if(!b)return;b.style.fontSize='';b.style.letterSpacing='';let fs=parseFloat(getComputedStyle(b).fontSize),n=0;
 const tw=()=>{try{const r=document.createRange();r.selectNodeContents(b);return r.getBoundingClientRect().width}catch(e){return b.scrollWidth}};
 while(tw()>b.clientWidth-1&&fs>10.5&&n++<30){fs-=.5;b.style.fontSize=fs+'px';if(fs<14)b.style.letterSpacing='.02em'}}
try{new ResizeObserver(()=>requestAnimationFrame(fitBrand)).observe($('.brand'))}catch(e){window.addEventListener('resize',fitBrand)}
fitBrand();
window.addEventListener('resize',()=>{if(cur==='mapa')resizeMap()});
updatePosUI();
const initV=(location.hash||'').slice(1);
go(VIEWS.includes(initV)?initV:'mapa');
requestAnimationFrame(()=>{resizeMap();fitOld()});
// primeira visita: tutorial (o GPS é pedido no fim dele). Depois: GPS liga sozinho.
if(!store.get('toured',false))setTimeout(()=>startTour(0),650);
else if(!FRAMED)setTimeout(()=>startGPS(false),600);
// app offline (só no site; dentro do Claude não há service worker)
if(!FRAMED&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))
 window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
</body>
