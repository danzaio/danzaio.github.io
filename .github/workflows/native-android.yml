name: GoT Dubrovnik Android app
on:
  push:
    branches: [main]
    paths: ['got-dubrovnik/**', 'got-dubrovnik-native/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: got-dubrovnik-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: mkdir -p www && cp -r ../got-dubrovnik/* www/
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: got-dubrovnik-native/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk got-dubrovnik.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: GoT Dubrovnik Android (latest build)
          body: Debug build of the Android app, rebuilt on every change to the guide. Install by opening the APK on an Android phone and allowing installs from the browser.
          files: got-dubrovnik-native/got-dubrovnik.apk
          prerelease: true

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from the release
        # o repo é privado: baixa pela API com o token do próprio workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-latest -R ${{ github.repository }} -p got-dubrovnik.apk -O app.apk --clobber
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app in an emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash got-dubrovnik-native/smoke.sh
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: android-latest
          files: |
            shots/*.png
            shots/*.txt
