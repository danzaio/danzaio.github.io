name: GoT Dubrovnik Android app
on:
  push:
    branches: [main]
    paths: ['got-dubrovnik/**', 'got-dubrovnik-native/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: got-dubrovnik-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: mkdir -p www && cp -r ../got-dubrovnik/* www/
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: got-dubrovnik-native/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk got-dubrovnik.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: GoT Dubrovnik Android (latest build)
          body: Debug build of the Android app, rebuilt on every change to the guide. Install by opening the APK on an Android phone and allowing installs from the browser.
          files: got-dubrovnik-native/got-dubrovnik.apk
          prerelease: true
